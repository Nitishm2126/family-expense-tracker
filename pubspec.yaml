name: family_expense_tracker
description: "A premium family expense & income tracker for the Sundaran family."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  http: ^1.2.1

  # Local storage / offline cache
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.68.0

  # UI polish
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # Dates
  intl: ^0.19.0
  table_calendar: ^3.1.2

  # PDF generation & sharing
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^9.0.0
  path_provider: ^2.1.3

  # Security
  local_auth: ^2.3.0
  crypto: ^3.0.3

  # Utils
  equatable: ^2.0.5
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  fluttertoast: ^8.2.8
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/images/logo.jpg
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.jpg"
